# compose.prod.yml — production/self-hosted infra (Qdrant + Postgres + Redis)
#
# Same services as docker-compose.yml but with healthchecks (so an orchestrator
# can gate on real readiness), restart policies, and resource-limit hints.
#
#   docker compose -f compose.prod.yml up -d
#   docker compose -f compose.prod.yml ps
#
# Managed alternatives (RDS/Cloud SQL, Qdrant Cloud, ElastiCache/Upstash) need
# no compose at all — just point DATABASE_URL / QDRANT_URL / REDIS_URL at them
# (see PRODUCTION.md). The app containers (backend + ARQ worker) are not part
# of this file: run them as your own services against this infra.

services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; cat <&3 | head -n1 | grep -q \"200 OK\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: librarian
      POSTGRES_PASSWORD: librarian
      POSTGRES_DB: librarian
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librarian -d librarian"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

volumes:
  qdrant_storage:
  postgres_data:
  redis_data:
