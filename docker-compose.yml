services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: librarian-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  postgres:
    image: postgres:16
    container_name: librarian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: librarian
      POSTGRES_PASSWORD: librarian
      POSTGRES_DB: librarian
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Browser GUI for Postgres — opt-in via `docker compose --profile tools up -d`
  adminer:
    image: adminer:latest
    container_name: librarian-adminer
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  qdrant_storage:
  postgres_data:
