services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: librarian-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  postgres:
    image: postgres:16
    container_name: librarian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: librarian
      POSTGRES_PASSWORD: librarian
      POSTGRES_DB: librarian
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_storage:
  postgres_data:
